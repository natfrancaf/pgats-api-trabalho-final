name: Node.js CI

on:
  push:
    branches: [ "main", criando-testes]
  pull_request:
    branches: [ "main", criando-testes]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    - name: Install dependencies
      run: npm install

    - name: Run tests
      run: npm run test-rest
